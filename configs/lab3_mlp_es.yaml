# Lab 3 homework: the MLP of lab3_mlp.yaml with honest early stopping.
# Copy this per experiment and change one thing at a time.
name: lab3_mlp_es
seed: 42

data:
  labels: data/raw/train.csv
  images: data/raw/train
  pixel_size: 64           # the photograph is reduced to pixel_size x pixel_size grey levels

split:
  strategy: by_group
  group_column: group_strict   # layout-clean units; this is how the test set was cut
  val_fraction: 0.2
  seed: 3                       # the split has its own seed: changing the model seed must not move the validation set

model:
  type: mlp
  hidden: [256, 64]
  dropout: 0.3

train:
  epochs: 60
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.0001
  log_every: 10
  # Whole strict units of the *training* rows are set aside; the epoch that scores
  # best on them is kept. The validation rows only report, they never choose.
  early_stopping:
    val_fraction: 0.15     # one unit: build_splits stops at the first that reaches it
    seed: 8                # holds out strict unit 6 (two-column pages; the family stays in training via unit 5)

wandb:
  project: dl2026-docphoto
  tags: [lab3, early-stopping]
